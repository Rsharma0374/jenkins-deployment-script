apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eureka-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Prefix /eureka;
spec:
  rules:
  - host: eureka.guardianservices.in
    http:
      paths:
      - path: /eureka(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: eureka-service
            port:
              number: 8761
